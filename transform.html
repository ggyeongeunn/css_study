<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform</title>
    <link rel="stylesheet" href="css/transform.css" />
  </head>
  <body>
    <!-- translate -->
    <div class="container">
      <div class="origin">
        <div class="movex"></div>
      </div>
      <div class="origin">
        <div class="movey"></div>
      </div>
      <div class="origin">
        <div class="movexy"></div>
      </div>
    </div>
    <!-- scale -->
    <div class="container">
      <div class="origin">
        <div class="scalex"></div>
      </div>
      <div class="origin">
        <div class="scaley"></div>
      </div>
      <div class="origin">
        <div class="scale"></div>
      </div>
    </div>
    <!-- rotate -->
    <div class="container">
      <div class="origin" id="rotate1">
        <img src="images/tree.jpg" alt="tree" />
      </div>
      <div class="origin" id="rotate2">
        <img src="images/tree.jpg" alt="tree" />
      </div>
    </div>
    <div class="container">
      <div class="origin" id="rotate3">
        <img src="images/tree.jpg" alt="tree" />
      </div>
      <div class="origin" id="rotate4">
        <img src="images/tree.jpg" alt="tree" />
      </div>
    </div>
    <!-- skew -->
    <div class="container">
      <div class="origin">
        <div class="skewx"></div>
      </div>
      <div class="origin">
        <div class="skewy"></div>
      </div>
      <div class="origin">
        <div class="skewxy"></div>
      </div>
    </div>
  </body>
</html>
